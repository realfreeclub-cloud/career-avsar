# ==============================================================================
# Career Avsar - Production Nginx Virtual Host (PM2 / Node.js Direct Deployment)
# File: /etc/nginx/sites-available/careeravsar.in
# Symlink: /etc/nginx/sites-enabled/careeravsar.in
# Port: 3003 (bound to 127.0.0.1)
# ==============================================================================

# Isolated Rate Limiting Zones (Scoped only to Career Avsar)
limit_req_zone $binary_remote_addr zone=ca_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ca_auth_limit:10m rate=5r/s;

# 1. HTTP Server: ACME Challenge & Permanent Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name careeravsar.in www.careeravsar.in;

    # Let's Encrypt validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server: SSL Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careeravsar.in www.careeravsar.in;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/careeravsar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careeravsar.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum upload size for teacher resumes, certifications and scans
    client_max_body_size 25m;

    # Gzip Compression Optimization for Next.js Payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Next.js Static Optimization: Cache immutable static build assets
    location /_next/static/ {
        alias /var/www/career-avsar/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Brand and Static Media Assets
    location /brand/ {
        alias /var/www/career-avsar/public/brand/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Rate-limited Auth API
    location /api/auth/ {
        limit_req zone=ca_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Rate-limited General API
    location /api/ {
        limit_req zone=ca_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Next.js Application Server Proxy
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
