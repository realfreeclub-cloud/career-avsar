# ==============================================================================
# Career Avsar - Initial HTTP Configuration (Use this BEFORE running Certbot)
# File: /etc/nginx/sites-available/careeravsar.in
# Symlink: /etc/nginx/sites-enabled/careeravsar.in
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name careeravsar.in www.careeravsar.in;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Proxy traffic to Next.js on port 3003
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
